# Ingress 1: API routes sent straight to the backend services.
# The backends serve /users, /products and /orders (no /api prefix),
# so the /api prefix is stripped with rewrite-target.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: microservices.local
      http:
        paths:
          - path: /api/(users.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 3000
          - path: /api/(products.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: product-service
                port:
                  number: 3001
          - path: /api/(orders.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-service
                port:
                  number: 3002
---
# Ingress 2: everything else goes to the gateway, path unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-gateway-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: microservices.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3003
