apiVersion: v1
kind: Service
metadata:
  name: order-service           # this is the DNS name other pods use
  labels:
    app: order-service
spec:
  type: ClusterIP # the default type, exposes the service on a cluster-internal IP. Other pods in the cluster can reach this service.
  selector:
    app: order-service          # must match the pod labels
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP