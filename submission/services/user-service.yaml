apiVersion: v1
kind: Service
metadata:
  name: user-service           # this is the DNS name other pods use
  labels:
    app: user-service
spec:
  type: ClusterIP # the default type, exposes the service on a cluster-internal IP. Other pods in the cluster can reach this service.
  selector:
    app: user-service          # must match the pod labels
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP