apiVersion: v1
kind: Service
metadata:
  name: product-service           # this is the DNS name other pods use
  labels:
    app: product-service
spec:
  type: ClusterIP # the default type, exposes the service on a cluster-internal IP. Other pods in the cluster can reach this service.
  selector:
    app: product-service          # must match the pod labels
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP