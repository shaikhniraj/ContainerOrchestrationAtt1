apiVersion: v1
kind: Service
metadata:
  name: gateway-service           # this is the DNS name other pods use
  labels:
    app: gateway-service
spec:
  type: NodePort # the default type, exposes the service on a cluster-internal IP. Other pods in the cluster can reach this service.
  selector:
    app: gateway-service          # must match the pod labels
  ports:
    - port: 3003
      targetPort: 3003
      nodePort: 30003
      